# Reels Programados (ADR-0051): a borda dispara 90 e 60 minutos antes de cada um (lista em
# packages/shared/src/programados.ts). O job grava, cria o container e põe na agenda da borda,
# que publica na hora. Rodar à mão só faz algo dentro da janela de cada Programado.
name: programados
on:
  schedule:
    # Reserva só no dia de cada Programado (quem dispara de verdade é a borda): 17/11, 19h a 20h30.
    - cron: '0,30 22,23 17 11 *'
  # A borda (Cloudflare) dispara este workflow na hora certa com origem=borda; o cron acima
  # é a reserva, porque o do GitHub atrasa e às vezes pula.
  workflow_dispatch:
    inputs:
      origem:
        description: 'Quem disparou (manual roda sempre; borda só com LIGA_ATIVA=sim)'
        default: manual
concurrency: programados
jobs:
  programados:
    # LIGA_ATIVA é variável do repositório (o if do job não enxerga as do ambiente).
    # Rodar à mão (workflow_dispatch) vale mesmo com a Liga desligada: é o ensaio.
    if: vars.LIGA_ATIVA == 'sim' || (github.event_name == 'workflow_dispatch' && inputs.origem != 'borda')
    runs-on: ubuntu-latest
    # Segredos e variáveis ficam no ambiente PROD.
    environment: PROD
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          video: 'true'
      - run: pnpm job programados

# Muda o Time (e a posição) de um Jogador à mão, sem gastar a Transferência (ADR-0029), e atualiza o site.
# Só à mão: Actions → mover-jogador → Run workflow.
name: mover-jogador
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: '@ do Jogador (sem o @)'
        required: true
      time:
        description: 'Time de destino (ex.: onca)'
        required: true
      posicao:
        description: 'Posição (ex.: zagueiro); vazio mantém a atual'
        required: false
      id:
        description: 'Opcional: id do Jogador, quando há dois com o mesmo @'
        required: false
jobs:
  mover:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
      USUARIO: ${{ inputs.usuario }}
      ID: ${{ inputs.id }}
      TIME: ${{ inputs.time }}
      POSICAO: ${{ inputs.posicao }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm liga mover
      # A coleta republica os dados do site (com o Jogador no Time novo).
      - run: pnpm job coletar

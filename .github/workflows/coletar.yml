# De hora em hora: renova o token, lê ENTRO/CRAQUE nos comentários e atualiza o site.
# Nada roda até a variável do repositório LIGA_ATIVA valer "sim" (docs/implantacao.md).
name: coletar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency: coletar
jobs:
  coletar:
    # LIGA_ATIVA é variável do repositório (o if do job não enxerga as do ambiente).
    # Rodar à mão (workflow_dispatch) vale mesmo com a Liga desligada: é o ensaio.
    if: vars.LIGA_ATIVA == 'sim' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Segredos e variáveis ficam no ambiente PROD.
    environment: PROD
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm job coletar

# Inscreve à mão quem pediu pela DM (mesmas regras do ENTRO; time cheio realoca) e atualiza o site.
# Só à mão: Actions → inscrever-jogador → Run workflow.
name: inscrever-jogador
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: '@ de quem pediu (sem o @)'
        required: true
      time:
        description: 'Time (ex.: onca)'
        required: true
      posicao:
        description: 'Posição (ex.: atacante)'
        required: false
      forcar:
        description: 'Forçar o Time mesmo cheio (ignora o equilíbrio de Elencos, ADR-0029)'
        type: boolean
        default: false
jobs:
  inscrever:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
      USUARIO: ${{ inputs.usuario }}
      TIME: ${{ inputs.time }}
      POSICAO: ${{ inputs.posicao }}
      FORCAR: ${{ inputs.forcar }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm liga inscrever
      # A coleta republica os dados do site (com o Jogador novo).
      - run: pnpm job coletar

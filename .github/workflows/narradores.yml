# Cria os candidatos a Narrador no Voice design do Gemini e guarda as amostras (mp3) como
# artefato do workflow, para ouvir e escolher. Só à mão.
name: narradores
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'JSON {"Nome": "voice_..."} para regravar sem criar vozes novas'
        default: ''
permissions:
  contents: write
jobs:
  narradores:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NARRADORES_IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          video: 'true'
      - run: pnpm --filter @liga/renderer narradores "$RUNNER_TEMP/narradores"
      - uses: actions/upload-artifact@v4
        with:
          name: narradores
          path: |
            ${{ runner.temp }}/narradores/*.mp3
            ${{ runner.temp }}/narradores/narradores.json
      # As amostras também vão para o branch 'amostras' (só os mp3 e os ids), para baixar com git.
      - run: |
          cd "$RUNNER_TEMP/narradores"
          git init -q -b amostras && git add *.mp3 narradores.json
          git -c user.name=liga -c user.email=liga@users.noreply.github.com commit -qm "Amostras dos Narradores"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras

# Cria os candidatos a Narrador no Voice design do Gemini e guarda as amostras (mp3) como
# artefato do workflow, para ouvir e escolher. Só à mão.
name: narradores
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'JSON {"Nome": "voice_..."} para regravar sem criar vozes novas'
        default: ''
      cota:
        description: 'Opções de pronúncia de Varzeão (um pedido de voz)'
        type: boolean
        default: false
      pronuncia:
        description: 'Só o teste de pronúncia (sem criar vozes nem amostras)'
        type: boolean
        default: false
      jeitos:
        description: 'Prévia: JSON {"Nome": "jeito de narrar"} para testar o estilo de cada um'
        default: ''
      lite:
        description: 'Gravar pelo modelo lite (quando a cota do principal acabou)'
        type: boolean
        default: false
      catalogo:
        description: 'Só lista as vozes prontas pt-BR da biblioteca (sem gerar áudio)'
        type: boolean
        default: false
      previa:
        description: 'Prévia de comparação: a mesma fala com cada Narrador (5 pedidos de voz, branch previa-narradores)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  narradores:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NARRADORES_IDS: ${{ inputs.ids }}
      NARRADORES_JEITOS: ${{ inputs.jeitos }}
      NARRADORES_LITE: ${{ inputs.lite && '1' || '' }}
      NARRADORES_PREVIA: ${{ inputs.previa && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          video: 'true'
      - if: inputs.cota && !inputs.catalogo
        run: |
          pnpm --filter @liga/renderer exec tsx scripts/opcoes-pronuncia.ts "$RUNNER_TEMP/narradores"
          cd "$RUNNER_TEMP/narradores" && git init -q -b amostras && git add opcoes-varzeao.mp3
          git -c user.name=liga -c user.email=liga@users.noreply.github.com commit -qm "Opções de pronúncia"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras
      - if: inputs.catalogo
        run: |
          pnpm --filter @liga/renderer exec tsx scripts/catalogo.ts "$RUNNER_TEMP/catalogo"
          cd "$RUNNER_TEMP/catalogo" && git init -q -b catalogo-vozes && git add catalogo.json
          git -c user.name=liga -c user.email=liga@users.noreply.github.com commit -qm "Catálogo de vozes pt-BR"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" catalogo-vozes
      - if: inputs.pronuncia && !inputs.cota && !inputs.catalogo
        run: pnpm --filter @liga/renderer pronuncia
      - if: ${{ !inputs.pronuncia && !inputs.cota && !inputs.catalogo }}
        run: pnpm --filter @liga/renderer narradores "$RUNNER_TEMP/narradores"
      - if: ${{ !inputs.pronuncia && !inputs.cota && !inputs.catalogo }}
        uses: actions/upload-artifact@v4
        with:
          name: narradores
          path: |
            ${{ runner.temp }}/narradores/*.mp3
            ${{ runner.temp }}/narradores/narradores.json
      # As amostras também vão para o branch 'amostras' (só os mp3 e os ids), para baixar com git.
      - if: ${{ !inputs.pronuncia && !inputs.cota && !inputs.catalogo }}
        run: |
          cd "$RUNNER_TEMP/narradores"
          RAMO=${{ inputs.previa && 'previa-narradores' || 'amostras' }}
          git init -q -b "$RAMO" && git add *.mp3 narradores.json
          git -c user.name=liga -c user.email=liga@users.noreply.github.com commit -qm "Amostras dos Narradores"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RAMO"

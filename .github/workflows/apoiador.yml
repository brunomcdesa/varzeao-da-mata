# Apoiador (ADR-0108). Só à mão: Actions → apoiador → Run workflow.
# Liga o apoio do Apoia-se ao @ da pessoa: nível 5 ou 15 abre (ou troca de nível); nível vazio
# encerra quando ela cancela. Quem joga ganha o Selo de Apoiador (e, com 15, o Item de Apoiador);
# quem não joga entra só nos créditos do Resumo da Temporada.
# Primeiro rode sem "gravar" (simulação: o log mostra o que vai mudar).
name: apoiador
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: '@ de quem apoia (sem o @)'
        required: true
      nivel:
        description: 'Nível do apoio'
        type: choice
        options: ['15', '5', 'encerrar']
        default: '15'
      gravar:
        description: 'Gravar (desmarcado = só simulação)'
        type: boolean
        default: false
jobs:
  apoiador:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
      USUARIO: ${{ inputs.usuario }}
      NIVEL: ${{ inputs.nivel != 'encerrar' && inputs.nivel || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - if: ${{ !inputs.gravar }}
        run: pnpm liga apoiador
      - if: ${{ inputs.gravar }}
        run: pnpm liga apoiador --gravar
      # A coleta republica os dados do site (o Selo na Carreira).
      - if: ${{ inputs.gravar }}
        run: pnpm job coletar

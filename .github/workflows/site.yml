# Publica o site no Cloudflare Pages quando o código dele muda (os dados vêm da borda).
# Usa os segredos e variáveis do ambiente PROD (docs/implantacao.md).
name: site
on:
  push:
    branches: [master]
    paths: ['packages/site/**', 'packages/renderer/src/**', 'packages/shared/**', '.github/workflows/site.yml']
  workflow_dispatch:
concurrency: site
jobs:
  publicar:
    runs-on: ubuntu-latest
    # Segredos e variáveis ficam no ambiente PROD.
    environment: PROD
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm --filter @liga/site build
        env:
          LIGA_DADOS_URL: ${{ vars.LIGA_EDGE_URL }}/dados/
          LIGA_API_URL: ${{ vars.LIGA_EDGE_URL }}
          LIGA_TURNSTILE_SITEKEY: ${{ vars.LIGA_TURNSTILE_SITEKEY }}
          LIGA_INSTAGRAM: ${{ vars.LIGA_INSTAGRAM }}
          LIGA_VAPID_PUBLICA: ${{ vars.LIGA_VAPID_PUBLICA }}
      - run: rm -rf packages/site/dist/dados
      - run: pnpm --filter @liga/edge exec wrangler pages deploy ../site/dist --project-name=${{ vars.CF_PAGES_PROJETO }} --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

# Lista os comentários lidos e o resultado de cada um (para achar formatos que o leitor
# ainda não entende). Só à mão: Actions → comentarios → Run workflow.
name: comentarios
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: 'Opcional: só os comentários deste @'
        default: ''
jobs:
  comentarios:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USUARIO: ${{ inputs.usuario }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm liga comentarios

# Lista os comentários lidos e o resultado de cada um (para achar formatos que o leitor
# ainda não entende). Só à mão: Actions → comentarios → Run workflow.
name: comentarios
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: 'Opcional: só os comentários deste @'
        default: ''
jobs:
  comentarios:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USUARIO: ${{ inputs.usuario }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm liga comentarios
      # Com um @: procura o comentário dessa pessoa direto no Instagram, em todos os posts.
      - if: inputs.usuario != ''
        run: pnpm job procurar

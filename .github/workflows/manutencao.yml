# Ajustes de dados à mão, um comando por vez, e atualiza o site.
# Só à mão: Actions → manutencao → Run workflow.
#   vincular-conta: liga o Jogador inscrito pela DM (id provisório) à conta do Instagram dele.
#   corrigir-trocas-de-posicao: devolve o OVR de quem trocou de posição pela regra antiga (ADR-0030).
name: manutencao
on:
  workflow_dispatch:
    inputs:
      comando:
        description: 'O que fazer'
        type: choice
        options: [vincular-conta, corrigir-trocas-de-posicao]
      usuario:
        description: '@ do Jogador (só no vincular-conta)'
        required: false
jobs:
  manutencao:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ vars.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PUBLICO: ${{ vars.R2_BUCKET_PUBLICO }}
      R2_BUCKET_PRIVADO: ${{ vars.R2_BUCKET_PRIVADO }}
      R2_URL_PUBLICA: ${{ vars.R2_URL_PUBLICA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOZ: ${{ vars.GEMINI_TTS_VOZ || 'Lumi' }}
      GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM || '10' }}
      USUARIO: ${{ inputs.usuario }}
      COMANDO: ${{ inputs.comando }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: pnpm liga "$COMANDO"
      # A coleta republica os dados do site.
      - run: pnpm job coletar

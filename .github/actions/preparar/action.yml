name: Preparar
description: Node, pnpm, dependências e (opcional) o que o vídeo precisa (Chromium, ffmpeg e o cache de falas).
inputs:
  video:
    description: Instala Chromium e ffmpeg para gravar Reels e traz o cache de falas do Narrador.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    # ---- vídeo sem apt (ADR-0037): o espelho do apt travou a Partida das 12h de 11/11. O ffmpeg
    # vem do PyPI (versão fixa, conferida pelo sha256) e o Chromium do Playwright vai sem
    # --with-deps (o runner já traz o Google Chrome e as bibliotecas dele). Os dois ficam em cache.
    - if: inputs.video == 'true'
      id: versoes
      shell: bash
      run: |
        echo "playwright=$(node -p "const p=require('./packages/renderer/package.json'); (p.dependencies||{}).playwright||(p.devDependencies||{}).playwright")" >> "$GITHUB_OUTPUT"
    - if: inputs.video == 'true'
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: ~/.cache/ffmpeg-estatico
        key: ffmpeg-imageio-0.7.0-linux64
    - if: inputs.video == 'true' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
      name: Baixar o ffmpeg estático (imageio-ffmpeg 0.7.0 do PyPI)
      shell: bash
      env:
        RODA: https://files.pythonhosted.org/packages/04/96/15fe7ef562f7494c358cbd9b521d2da82d7a331b5513703756166478bd5f/imageio_ffmpeg-0.7.0-py3-none-manylinux2014_x86_64.whl
        SHA256: 4e1f36bef7bedd4bc5dc25f60a8345d88f57133fa1e754f09b411ac61b854408
      run: |
        tmp=$(mktemp -d)
        curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 -o "$tmp/ff.whl" "$RODA"
        echo "$SHA256  $tmp/ff.whl" | sha256sum -c -
        python3 -m zipfile -e "$tmp/ff.whl" "$tmp/x"
        mkdir -p ~/.cache/ffmpeg-estatico
        install -m 755 "$tmp"/x/imageio_ffmpeg/binaries/ffmpeg-* ~/.cache/ffmpeg-estatico/ffmpeg
    - if: inputs.video == 'true'
      shell: bash
      run: |
        echo "$HOME/.cache/ffmpeg-estatico" >> "$GITHUB_PATH"
        "$HOME/.cache/ffmpeg-estatico/ffmpeg" -hide_banner -version | sed -n 1p
    - if: inputs.video == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.versoes.outputs.playwright }}-chromium
    - if: inputs.video == 'true'
      shell: bash
      # Com o cache, só confere; sem ele, baixa do CDN do Playwright (não usa o apt).
      run: timeout 600 pnpm --filter @liga/renderer exec playwright install chromium

    # Cache de falas do Narrador (ADR-0018): as falas do Gemini TTS ficam guardadas entre as
    # execuções e são reaproveitadas, para caber na cota com 8 Partidas por dia. Cada execução
    # restaura o cache mais recente e, no fim, salva uma versão nova com as falas que ganhou.
    - if: inputs.video == 'true'
      uses: actions/cache@v4
      with:
        path: packages/renderer/.cache/locutor
        # "v2" (ADR-0049): o cache anterior podia ter falas com o áudio de outra; começa do zero.
        key: locutor-v2-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: locutor-v2-

name: Preparar
description: Node, pnpm, dependências e (opcional) o que o vídeo precisa (Chromium, ffmpeg e o cache de falas).
inputs:
  video:
    description: Instala Chromium e ffmpeg para gravar Reels e traz o cache de falas do Narrador.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.video == 'true'
      # O apt-get update já travou o job inteiro (11/11): tudo aqui tem limite de tempo e,
      # se o espelho do apt não responder, segue com o que o runner já tem.
      run: |
        APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
        if ! command -v ffmpeg >/dev/null; then
          timeout 180 sudo apt-get update -qq $APT || echo "::warning::apt-get update não respondeu; seguindo"
          timeout 300 sudo apt-get install -y -qq $APT ffmpeg
        fi
        timeout 300 pnpm --filter @liga/renderer exec playwright install --with-deps chromium \
          || { echo "::warning::sem --with-deps (apt travou); instalando só o Chromium"; pnpm --filter @liga/renderer exec playwright install chromium; }
      shell: bash
    # Cache de falas do Narrador (ADR-0018): as falas do Gemini TTS ficam guardadas entre as
    # execuções e são reaproveitadas, para caber na cota com 8 Partidas por dia. Cada execução
    # restaura o cache mais recente e, no fim, salva uma versão nova com as falas que ganhou.
    - if: inputs.video == 'true'
      uses: actions/cache@v4
      with:
        path: packages/renderer/.cache/locutor
        key: locutor-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: locutor-

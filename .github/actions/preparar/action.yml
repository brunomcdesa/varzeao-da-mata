name: Preparar
description: Node, pnpm, dependências e (opcional) o que o vídeo precisa (Chromium e ffmpeg).
inputs:
  video:
    description: Instala Chromium e ffmpeg para gravar Reels.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.video == 'true'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
        pnpm --filter @liga/renderer exec playwright install --with-deps chromium
      shell: bash

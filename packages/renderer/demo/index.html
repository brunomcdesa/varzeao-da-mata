<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Replay · Varzeão da Mata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Jersey+10&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fundo: #0c1a13;
      --painel: #13281d;
      --painel-2: #1a3426;
      --borda: #24452f;
      --texto: #eef3ec;
      --suave: #9fb5a6;
      --destaque: #f2b705;
      --gol: #f2b705;
      --defesa: #5fc4ff;
      --desarme: #9fe08a;
      --fora: #8a9a90;
      --sobe: #6fdc8c;
      --cai: #ff7a6b;
      --display: "Barlow Condensed", "Arial Narrow", sans-serif;
      --corpo: "Archivo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font: 15px/1.45 var(--corpo);
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 24px 6px;
    }
    h1 {
      margin: 0;
      font: 800 30px/1 var(--display);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    h1 span { color: var(--destaque); }
    header p { margin: 0; color: var(--suave); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(0, 1fr);
      gap: 24px;
      padding: 16px 24px 32px;
      align-items: start;
    }
    .palco {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    canvas {
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      background: #10241a;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      display: block;
    }
    .controles {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, select {
      font: 600 14px var(--corpo);
      color: var(--texto);
      background: var(--painel-2);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--suave); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
    #play { background: var(--destaque); color: #1a1a1a; border-color: var(--destaque); min-width: 96px; }
    [data-velocidade][aria-pressed="true"] { background: var(--texto); color: var(--fundo); }
    #barra { width: 100%; accent-color: var(--destaque); }
    .lado { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .card {
      background: var(--painel);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font: 700 20px/1 var(--display);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .confronto {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    .confronto label { display: flex; flex-direction: column; gap: 6px; color: var(--suave); font-size: 13px; }
    .confronto select { width: 100%; }
    .forca { display: flex; align-items: center; gap: 8px; }
    .forca input { flex: 1; accent-color: var(--destaque); }
    .forca output { font: 700 18px var(--display); color: var(--texto); min-width: 2ch; text-align: right; }
    .meta { margin: 12px 0 0; color: var(--suave); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    #resumo { margin: 0; color: var(--texto); }
    ol#lances { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
    .lance {
      display: grid;
      grid-template-columns: 3ch 72px 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 6px 8px;
      font-weight: 400;
    }
    .lance:hover { background: var(--painel-2); }
    .lance.atual { background: var(--painel-2); box-shadow: inset 3px 0 0 var(--destaque); }
    .lance.futuro { opacity: 0.38; }
    .lance .min { font: 700 16px var(--display); color: var(--suave); text-align: right; }
    .lance .chip { font: 700 12px var(--corpo); text-transform: uppercase; letter-spacing: 0.04em; text-align: center; border-radius: 99px; padding: 2px 0; color: #10241a; }
    .tipo-gol .chip { background: var(--gol); }
    .tipo-defesa .chip { background: var(--defesa); }
    .tipo-desarme .chip { background: var(--desarme); }
    .tipo-fora .chip { background: var(--fora); }
    .tipo-gol .txt { font-weight: 700; }
    .lance .sig { font: 700 14px var(--display); color: var(--suave); }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--borda); white-space: nowrap; }
    th { color: var(--suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.sig { font: 700 15px var(--display); }
    td.acoes { color: var(--suave); white-space: normal; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .sobe { color: var(--sobe); font-weight: 700; }
    .cai { color: var(--cai); font-weight: 700; }
    .igual { color: var(--suave); }
    @media (max-width: 820px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      main { grid-template-columns: 1fr; }
      .palco { position: static; max-width: 440px; margin: 0 auto; width: 100%; }
      .confronto { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Varzeão <span>da Mata</span></h1>
    <p>Replay de demonstração · sim + renderer em tempo de relógio</p>
  </header>
  <main>
    <section class="palco" aria-label="Partida">
      <canvas id="campo" width="1080" height="1920"></canvas>
      <input id="barra" type="range" min="0" max="5400" step="1" value="0" aria-label="Momento da Partida" />
      <div class="controles">
        <button id="play" type="button" aria-pressed="true">Pausar</button>
        <button type="button" data-velocidade="15" aria-pressed="true">1×</button>
        <button type="button" data-velocidade="30" aria-pressed="false">2×</button>
        <button type="button" data-velocidade="60" aria-pressed="false">4×</button>
        <button type="button" data-velocidade="150" aria-pressed="false">10×</button>
      </div>
    </section>

    <div class="lado">
      <section class="card">
        <h2>Confronto</h2>
        <div class="confronto">
          <label>Mandante <select id="mandante"></select></label>
          <label>Visitante <select id="visitante"></select></label>
          <label>OVR médio do mandante
            <span class="forca"><input id="forca-mandante" type="range" min="45" max="90" value="70" /><output id="valor-mandante">70</output></span>
          </label>
          <label>OVR médio do visitante
            <span class="forca"><input id="forca-visitante" type="range" min="45" max="90" value="70" /><output id="valor-visitante">70</output></span>
          </label>
        </div>
        <div class="meta">
          <p id="resumo"></p>
          <span>seed <strong id="seed">—</strong> <button id="nova" type="button">Nova Partida</button></span>
        </div>
      </section>

      <section class="card">
        <h2>Lances</h2>
        <ol id="lances"></ol>
      </section>

      <section class="card">
        <h2>Ficha da Partida</h2>
        <div class="tabela">
          <table>
            <thead>
              <tr><th>Time</th><th>Jogador</th><th>Pos.</th><th>Ações</th><th class="num">Nota</th><th class="num">OVR</th><th class="num">Δ</th></tr>
            </thead>
            <tbody id="ficha"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="./main.js"></script>
</body>
</html>

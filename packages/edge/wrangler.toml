# Worker na borda do Varzeão da Mata. Antes do primeiro deploy, crie o KV e os buckets
# (docs/implantacao.md) e troque os ids abaixo.
name = "varzeao-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[vars]
# Não é segredo: é o id numérico da conta do Instagram (o token fica no KV).
IG_USER_ID = "17841428347535513"
# Repositório cujos workflows a borda dispara (o token vai como segredo GH_DISPARO_TOKEN).
GH_REPOSITORIO = "brunomcdesa/varzeao-da-mata"

[[kv_namespaces]]
binding = "AGENDA"
id = "467724d87d784111bafce2b26e48633c"

[[r2_buckets]]
binding = "PUBLICO"
bucket_name = "varzeao-publico"

[[r2_buckets]]
binding = "PRIVADO"
bucket_name = "varzeao-privado"

# Salas do Ao Vivo (ADR-0045): um Durable Object por Partida, com SQLite (plano grátis).
[[durable_objects.bindings]]
name = "SALAS"
class_name = "SalaAoVivo"

[[migrations]]
tag = "v1-salas-ao-vivo"
new_sqlite_classes = ["SalaAoVivo"]
